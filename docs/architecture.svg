<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Architecture map of the ShopLedger browser UI, Express server, routers, libraries, configuration and JSON store, with the seven-step order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
    <marker id="arrowAccent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#c2410c"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
      .title { font-size: 24px; font-weight: 700; }
      .sub { font-size: 14px; fill: #475569; }
      .panel-title { font-size: 15px; font-weight: 700; }
      .label { font-size: 13px; font-weight: 700; }
      .small { font-size: 12px; fill: #475569; }
      .step-number { font-size: 12px; font-weight: 700; fill: #ffffff; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.4; }
      .node { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; }
      .ticket { fill: #fff1e8; stroke: #c2410c; stroke-width: 1.8; }
      .dependency { fill: #f3edff; stroke: #6d28d9; stroke-width: 1.8; }
      .flow { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.3; }
      .line { fill: none; stroke: #64748b; stroke-width: 1.8; marker-end: url(#arrow); }
      .accent-line { fill: none; stroke: #c2410c; stroke-width: 1.8; marker-end: url(#arrowAccent); }
    </style>
  </defs>

  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="28" y="36" class="title">ShopLedger | application architecture</text>
  <text x="28" y="59" class="sub">Browser UI · Express routes · business logic · JSON data</text>

  <!-- Main architecture panels -->
  <rect x="24" y="78" width="190" height="416" rx="12" class="panel"/>
  <text x="40" y="104" class="panel-title">Browser UI · public/</text>
  <rect x="40" y="120" width="158" height="74" rx="8" class="node"/>
  <text x="52" y="145" class="label">index.html</text>
  <text x="52" y="165" class="small">POS, orders, Khata, audit</text>
  <rect x="40" y="208" width="158" height="90" rx="8" class="node"/>
  <text x="52" y="233" class="label">js/app.js</text>
  <text x="52" y="253" class="small">fetches API data;</text>
  <text x="52" y="271" class="small">submits orders and updates UI</text>
  <rect x="40" y="312" width="158" height="62" rx="8" class="node"/>
  <text x="52" y="338" class="label">css/style.css</text>
  <text x="52" y="358" class="small">app styling</text>
  <text x="40" y="415" class="small">Served by express.static()</text>
  <text x="40" y="435" class="small">from server.js</text>

  <rect x="238" y="78" width="178" height="416" rx="12" class="panel"/>
  <text x="254" y="104" class="panel-title">HTTP server</text>
  <rect x="254" y="132" width="146" height="118" rx="8" class="node"/>
  <text x="268" y="158" class="label">server.js</text>
  <text x="268" y="180" class="small">Express app</text>
  <text x="268" y="198" class="small">static public/</text>
  <text x="268" y="216" class="small">mounts /api routers</text>
  <text x="268" y="234" class="small">invoice page route</text>
  <rect x="254" y="276" width="146" height="68" rx="8" class="node"/>
  <text x="268" y="301" class="label">config.js</text>
  <text x="268" y="322" class="small">port, shop, GST, coupons</text>
  <text x="254" y="390" class="small">Invoice URL:</text>
  <text x="254" y="410" class="small">/orders/:id/invoice</text>

  <rect x="440" y="78" width="214" height="416" rx="12" class="panel"/>
  <text x="456" y="104" class="panel-title">Routers · routes/</text>
  <rect x="456" y="120" width="182" height="72" rx="8" class="node"/>
  <text x="468" y="146" class="label">orders.js</text>
  <text x="468" y="166" class="small">list, create, cancel orders</text>
  <text x="468" y="183" class="small">POST /orders</text>
  <rect x="456" y="204" width="182" height="62" rx="8" class="node"/>
  <text x="468" y="230" class="label">products.js</text>
  <text x="468" y="250" class="small">products and coupons</text>
  <rect x="456" y="278" width="182" height="62" rx="8" class="node"/>
  <text x="468" y="304" class="label">customers.js</text>
  <text x="468" y="324" class="small">Khata and settlement</text>
  <rect x="456" y="352" width="182" height="80" rx="8" class="node"/>
  <text x="468" y="378" class="label">reports.js</text>
  <text x="468" y="398" class="small">dashboard, reconciliation,</text>
  <text x="468" y="416" class="small">pricing preview, export</text>

  <rect x="678" y="78" width="314" height="416" rx="12" class="panel"/>
  <text x="694" y="104" class="panel-title">Business logic · lib/</text>
  <rect x="694" y="120" width="132" height="58" rx="8" class="node"/>
  <text x="706" y="145" class="label">pricing.js</text>
  <text x="706" y="164" class="small">subtotal, totals</text>
  <rect x="844" y="120" width="132" height="58" rx="8" class="node"/>
  <text x="856" y="145" class="label">coupons.js</text>
  <text x="856" y="164" class="small">validate, discount</text>
  <rect x="694" y="190" width="132" height="58" rx="8" class="dependency"/>
  <text x="706" y="215" class="label">tax.js</text>
  <text x="706" y="234" class="small">HSN rate, CGST/SGST</text>
  <rect x="844" y="190" width="132" height="58" rx="8" class="ticket"/>
  <text x="856" y="215" class="label">invoice.js</text>
  <text x="856" y="234" class="small">ticket: compute + render</text>
  <rect x="694" y="260" width="132" height="58" rx="8" class="node"/>
  <text x="706" y="285" class="label">inventory.js</text>
  <text x="706" y="304" class="small">stock check / reserve</text>
  <rect x="844" y="260" width="132" height="58" rx="8" class="node"/>
  <text x="856" y="285" class="label">orders.js</text>
  <text x="856" y="304" class="small">add, get, cancel, list</text>
  <rect x="694" y="330" width="132" height="58" rx="8" class="node"/>
  <text x="706" y="355" class="label">ledger.js</text>
  <text x="706" y="374" class="small">Khata and settlements</text>
  <rect x="844" y="330" width="132" height="58" rx="8" class="node"/>
  <text x="856" y="355" class="label">store.js</text>
  <text x="856" y="374" class="small">read / write JSON store</text>
  <rect x="694" y="400" width="132" height="58" rx="8" class="node"/>
  <text x="706" y="425" class="label">reports.js</text>
  <text x="706" y="444" class="small">dashboard, GST audit</text>
  <rect x="844" y="400" width="132" height="58" rx="8" class="node"/>
  <text x="856" y="425" class="label">dates.js</text>
  <text x="856" y="444" class="small">date helpers</text>

  <rect x="1016" y="78" width="160" height="174" rx="12" class="panel"/>
  <text x="1032" y="104" class="panel-title">Shared inputs</text>
  <rect x="1032" y="120" width="128" height="52" rx="8" class="node"/>
  <text x="1044" y="151" class="label">config.js</text>
  <rect x="1032" y="184" width="128" height="52" rx="8" class="node"/>
  <text x="1044" y="215" class="label">data/db.json</text>
  <text x="1016" y="274" class="small">store.read() / write()</text>
  <text x="1016" y="294" class="small">persists app records</text>

  <!-- Architecture relationships -->
  <path d="M198 248 H226 V191 H254" class="line"/>
  <path d="M400 178 H427 V156 H456" class="line"/>
  <path d="M400 194 H429 V235 H456" class="line"/>
  <path d="M400 210 H433 V309 H456" class="line"/>
  <path d="M400 226 H437 V392 H456" class="line"/>
  <path d="M638 156 H665 V149 H694" class="line"/>
  <path d="M826 149 H844" class="line"/>
  <path d="M760 178 V190" class="line"/>
  <path d="M910 178 V190" class="accent-line"/>
  <path d="M638 156 H668 V289 H694" class="line"/>
  <path d="M638 156 H672 V359 H694" class="line"/>
  <path d="M638 156 H676 V429 H694" class="line"/>
  <path d="M826 219 H844" class="accent-line"/>
  <path d="M976 359 H1000 V210 H1032" class="line"/>
  <path d="M976 149 H1000 V146 H1032" class="line"/>
  <path d="M400 305 H425 V219 H844" class="accent-line"/>

  <!-- Highlight legend -->
  <rect x="1016" y="326" width="160" height="132" rx="12" class="panel"/>
  <text x="1032" y="352" class="panel-title">Legend</text>
  <rect x="1032" y="366" width="20" height="18" rx="4" class="ticket"/>
  <text x="1060" y="380" class="small">Ticket module</text>
  <rect x="1032" y="394" width="20" height="18" rx="4" class="dependency"/>
  <text x="1060" y="408" class="small">Ticket dependency</text>
  <line x1="1032" y1="431" x2="1052" y2="431" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1060" y="435" class="small">Request / data flow</text>

  <!-- Numbered order placement flow -->
  <text x="28" y="535" class="panel-title">Order placement flow · POST /api/orders</text>
  <text x="28" y="556" class="small">Numbered sequence follows the route from browser input through persistence and response.</text>

  <rect x="24" y="574" width="154" height="148" rx="10" class="flow"/>
  <circle cx="45" cy="596" r="13" fill="#1d4ed8"/><text x="41" y="601" class="step-number">1</text>
  <text x="66" y="601" class="label">Browser</text>
  <text x="38" y="630" class="small">public/js/app.js</text>
  <text x="38" y="650" class="small">sends items, coupon,</text>
  <text x="38" y="670" class="small">customer, payment,</text>
  <text x="38" y="690" class="small">status to API</text>

  <path d="M178 648 H190" class="line"/>
  <rect x="190" y="574" width="154" height="148" rx="10" class="flow"/>
  <circle cx="211" cy="596" r="13" fill="#1d4ed8"/><text x="207" y="601" class="step-number">2</text>
  <text x="232" y="601" class="label">Route</text>
  <text x="204" y="630" class="small">routes/orders.js</text>
  <text x="204" y="650" class="small">reads db; resolves</text>
  <text x="204" y="670" class="small">product lines from</text>
  <text x="204" y="690" class="small">catalog records</text>

  <path d="M344 648 H356" class="line"/>
  <rect x="356" y="574" width="154" height="148" rx="10" class="flow"/>
  <circle cx="377" cy="596" r="13" fill="#1d4ed8"/><text x="373" y="601" class="step-number">3</text>
  <text x="398" y="601" class="label">Validate stock</text>
  <text x="370" y="630" class="small">inventory.find()</text>
  <text x="370" y="650" class="small">inventory.check()</text>
  <text x="370" y="670" class="small">rejects unknown or</text>
  <text x="370" y="690" class="small">unavailable items</text>

  <path d="M510 648 H522" class="line"/>
  <rect x="522" y="574" width="154" height="148" rx="10" class="flow"/>
  <circle cx="543" cy="596" r="13" fill="#1d4ed8"/><text x="539" y="601" class="step-number">4</text>
  <text x="564" y="601" class="label">Calculate</text>
  <text x="536" y="630" class="small">pricing.subtotal()</text>
  <text x="536" y="650" class="small">coupons.validate()</text>
  <text x="536" y="670" class="small">pricing.computeTotals()</text>
  <text x="536" y="690" class="small">uses tax.js HSN rates</text>

  <path d="M676 648 H688" class="line"/>
  <rect x="688" y="574" width="154" height="148" rx="10" class="flow"/>
  <circle cx="709" cy="596" r="13" fill="#1d4ed8"/><text x="705" y="601" class="step-number">5</text>
  <text x="730" y="601" class="label">Commit effects</text>
  <text x="702" y="630" class="small">Khata: ledger.</text>
  <text x="702" y="650" class="small">chargeOrderToKhata()</text>
  <text x="702" y="670" class="small">inventory.reserve()</text>
  <text x="702" y="690" class="small">when applicable</text>

  <path d="M842 648 H854" class="line"/>
  <rect x="854" y="574" width="154" height="148" rx="10" class="flow"/>
  <circle cx="875" cy="596" r="13" fill="#1d4ed8"/><text x="871" y="601" class="step-number">6</text>
  <text x="896" y="601" class="label">Build record</text>
  <text x="868" y="630" class="small">orders.add()</text>
  <text x="868" y="650" class="small">appendAudit()</text>
  <text x="868" y="670" class="small">adds order + audit</text>
  <text x="868" y="690" class="small">to in-memory db</text>

  <path d="M1008 648 H1020" class="line"/>
  <rect x="1020" y="574" width="156" height="148" rx="10" class="flow"/>
  <circle cx="1041" cy="596" r="13" fill="#1d4ed8"/><text x="1037" y="601" class="step-number">7</text>
  <text x="1062" y="601" class="label">Persist + reply</text>
  <text x="1034" y="630" class="small">store.write() →</text>
  <text x="1034" y="650" class="small">data/db.json</text>
  <text x="1034" y="670" class="small">route returns 201</text>
  <text x="1034" y="690" class="small">with saved order</text>

  <text x="28" y="762" class="small">Ticket highlight: lib/invoice.js · Supporting tax dependency: lib/tax.js · All labels verified against repository files.</text>
</svg>
